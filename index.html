<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Speedspec LLC — Engineering Your Students' Future</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800;900&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&family=Noto+Sans+Arabic:wght@300;400;600;700&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
--bg:#060d1b;--s1:rgba(255,255,255,.04);--s2:rgba(255,255,255,.07);
--b1:rgba(255,255,255,.08);--b2:rgba(255,255,255,.16);
--blue:#3b82f6;--bluel:#60a5fa;--bluedim:rgba(59,130,246,.12);
--gold:#fbbf24;--golddim:rgba(251,191,36,.1);
--text:#f1f5f9;--muted:#94a3b8;--dim:#475569;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
#app{min-height:100vh;font-family:'DM Sans',sans-serif}
#app.ar{font-family:'Noto Sans Arabic',sans-serif}
.df{font-family:'Barlow Condensed',sans-serif;letter-spacing:-.02em}
#app.ar .df{font-family:'Noto Sans Arabic',sans-serif;letter-spacing:0}
@keyframes fiu{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes shimmer{0%{background-position:-200% center}100%{background-position:200% center}}
.fiu{animation:fiu .7s cubic-bezier(.16,1,.3,1) both}
.fi{animation:fi .6s ease both}
.d1{animation-delay:.1s}.d2{animation-delay:.2s}.d3{animation-delay:.3s}.d4{animation-delay:.4s}.d5{animation-delay:.5s}.d6{animation-delay:.6s}
nav{position:sticky;top:0;z-index:200;height:64px;display:flex;align-items:center;border-bottom:1px solid var(--b1);background:rgba(6,13,27,.92);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.nav-inner{max-width:1120px;width:100%;margin:0 auto;padding:0 28px;display:flex;align-items:center;justify-content:space-between;gap:16px}
.logo{cursor:pointer;line-height:1}
.logo-m{font-family:'Barlow Condensed',sans-serif;font-size:22px;font-weight:900;color:var(--text);letter-spacing:.04em;display:block}
#app.ar .logo-m{font-family:'Noto Sans Arabic',sans-serif;font-size:18px}
.logo-s{font-size:9px;color:var(--blue);letter-spacing:.2em;font-weight:700;text-transform:uppercase}
.navl{display:flex;align-items:center;gap:24px}
.nl{font-size:12.5px;font-weight:500;color:var(--muted);cursor:pointer;transition:color .2s;position:relative;padding:3px 0;white-space:nowrap}
.nl:hover,.nl.act{color:var(--text)}
.nl.act::after{content:'';position:absolute;bottom:-2px;left:0;right:0;height:1.5px;background:var(--blue);border-radius:2px}
.navr{display:flex;align-items:center;gap:10px;flex-shrink:0}
.lb{background:transparent;border:1px solid var(--b1);border-radius:6px;padding:3px 9px;font-size:11.5px;font-weight:700;color:var(--dim);cursor:pointer;transition:all .2s}
.lb.act{background:rgba(59,130,246,.15);border-color:var(--blue);color:var(--bluel)}
.lb:hover{color:var(--text);border-color:var(--b2)}
.ctan{background:var(--blue);color:#fff;border:none;border-radius:8px;padding:9px 16px;font-size:12px;font-weight:600;cursor:pointer;transition:all .2s;white-space:nowrap}
.ctan:hover{background:#2563eb;box-shadow:0 6px 20px rgba(59,130,246,.4);transform:translateY(-1px)}
.page{max-width:1120px;margin:0 auto;padding:70px 28px 100px}
.badge{display:inline-flex;align-items:center;gap:6px;background:var(--golddim);border:1px solid rgba(251,191,36,.22);border-radius:100px;padding:5px 14px;font-size:11px;color:var(--gold);font-weight:700;letter-spacing:.08em;text-transform:uppercase;margin-bottom:18px}
.badgeb{background:var(--bluedim);border-color:rgba(59,130,246,.25);color:var(--bluel)}
h1.h{font-size:clamp(50px,6vw,82px);font-weight:900;line-height:1;white-space:pre-line;color:var(--text)}
h2.h2{font-size:clamp(38px,5vw,62px);font-weight:900;line-height:1.03;white-space:pre-line;color:var(--text)}
.sub{font-size:17px;line-height:1.65;color:var(--muted);max-width:620px;margin-top:14px}
.glass{background:var(--s1);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--b1);border-radius:16px}
.glasss{background:var(--s2);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--b2);border-radius:16px}
.gblu{position:absolute;border-radius:50%;background:radial-gradient(ellipse,rgba(59,130,246,.18) 0%,transparent 70%);pointer-events:none}
.ggld{position:absolute;border-radius:50%;background:radial-gradient(ellipse,rgba(251,191,36,.13) 0%,transparent 70%);pointer-events:none}
.tag{display:inline-flex;background:var(--bluedim);border:1px solid rgba(59,130,246,.2);border-radius:100px;padding:4px 12px;font-size:12px;color:var(--bluel);font-weight:500}
.inp{background:rgba(255,255,255,.04);border:1px solid var(--b1);border-radius:9px;padding:11px 14px;color:var(--text);font-family:inherit;font-size:14px;width:100%;outline:none;transition:border-color .2s}
.inp:focus{border-color:var(--blue);background:rgba(59,130,246,.05)}
.inp::placeholder{color:var(--dim)}
.lbl{font-size:12.5px;font-weight:600;color:var(--muted);margin-bottom:6px;display:block}
.btnm{background:var(--blue);color:#fff;border:none;border-radius:9px;padding:14px 28px;font-size:14.5px;font-weight:700;cursor:pointer;transition:all .25s;width:100%;margin-top:6px;letter-spacing:.01em}
.btnm:hover{background:#2563eb;box-shadow:0 8px 28px rgba(59,130,246,.45);transform:translateY(-2px)}
.btno{background:transparent;color:var(--text);border:1px solid var(--b2);border-radius:9px;padding:13px 26px;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s}
.btno:hover{background:rgba(255,255,255,.06);border-color:var(--b2)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:40px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:20px;margin-top:40px}
.g4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:18px;margin-top:40px}
@media(max-width:800px){.g2,.g3,.g4{grid-template-columns:1fr}.navl{display:none}.h{font-size:42px}.h2{font-size:36px}}
.hero-wrap{position:relative;overflow:hidden;padding:80px 28px 60px;max-width:1120px;margin:0 auto}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.04) 1px,transparent 1px);background-size:30px 30px;z-index:0}
.z1{position:relative;z-index:1}
.mstripe{background:linear-gradient(135deg,rgba(59,130,246,.1),rgba(251,191,36,.06));border:1px solid rgba(59,130,246,.18);border-radius:16px;padding:36px;margin-top:44px;position:relative;overflow:hidden}
.fcta{background:linear-gradient(135deg,rgba(59,130,246,.1),rgba(251,191,36,.05));border-top:1px solid var(--b1);padding:64px 28px;text-align:center}
.photo-ring{width:100px;height:100px;border-radius:50%;border:2.5px solid var(--gold);overflow:hidden;flex-shrink:0}
.photo-ring img{width:100%;height:100%;object-fit:cover;object-position:center top}
.stat-v{font-family:'Barlow Condensed',sans-serif;font-size:clamp(40px,5vw,56px);font-weight:900;line-height:1}
.sv-blue{background:linear-gradient(135deg,var(--bluel),var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.sv-gold{background:linear-gradient(135deg,#fde68a,var(--gold));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.step-lbar-0{background:var(--blue)}.step-lbar-1{background:var(--gold)}.step-lbar-2{background:rgba(99,179,237,1)}
.crisis-panel{display:none;margin-top:28px;animation:fiu .5s ease both}
.crisis-panel.open{display:block}
.card-hover{transition:transform .3s,border-color .3s}
.card-hover:hover{transform:translateY(-5px);border-color:var(--b2) !important}
.step-ghost{font-family:'Barlow Condensed',sans-serif;font-size:88px;font-weight:900;color:rgba(255,255,255,.04);line-height:1;position:absolute;top:12px;right:20px}
#app.ar .step-ghost{right:auto;left:20px}
.vis-wrap{width:100%;height:160px;display:flex;align-items:center;justify-content:center;margin-bottom:16px}
</style>
</head>
<body>
<div id="app">
<nav>
<div class="nav-inner">
  <div class="logo" onclick="nav('home')"><span class="logo-m">SPEEDSPEC</span><span class="logo-s">LLC</span></div>
  <div class="navl" id="NL"></div>
  <div class="navr">
    <button class="lb" id="bEN" onclick="setL('EN')">EN</button>
    <button class="lb" id="bFR" onclick="setL('FR')">FR</button>
    <button class="lb" id="bAR" onclick="setL('AR')">AR</button>
    <button class="ctan" id="NCTA" onclick="nav('contact')">Book a Diagnostic Audit</button>
  </div>
</div>
</nav>
<div id="PR"></div>
</div>

let lang='EN',page='home',t=T.EN,crisisOpen=false;
const app=document.getElementById('app');
const pr=document.getElementById('PR');

function setL(l){
  lang=l;t=T[l];
  ['EN','FR','AR'].forEach(x=>document.getElementById('b'+x).classList.toggle('act',x===l));
  app.classList.toggle('ar',l==='AR');
  app.dir=l==='AR'?'rtl':'ltr';
  document.getElementById('NCTA').textContent=t.cta;
  renderNav();renderPage();
}

function nav(p){
  page=p;crisisOpen=false;
  renderNav();renderPage();
  window.scrollTo({top:0,behavior:'smooth'});
}

function renderNav(){
  document.getElementById('NL').innerHTML=t.nav.map((n,i)=>`<span class="nl${page===t.nid[i]?' act':''}" onclick="nav('${t.nid[i]}')">${n}</span>`).join('');
}

function toggleCrisis(){
  crisisOpen=!crisisOpen;
  const p=document.getElementById('cpanel');
  const b=document.getElementById('ctbtn');
  if(p){p.classList.toggle('open',crisisOpen);b.textContent=crisisOpen?t.ctoggle2:t.ctoggle;}
}

function handleSubmit(){
  const b=document.querySelector('.btnm');
  const orig=b.textContent;
  b.textContent=lang==='AR'?'✓ تم الإرسال بنجاح!':lang==='FR'?'✓ Envoyé avec succès!':'✓ Request Sent Successfully!';
  b.style.background='#16a34a';
  setTimeout(()=>{b.textContent=orig;b.style.background='var(--blue)';},3500);
}
